<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Clean, modern iOS/macOS/Fluent frosted dark glass & blue depth -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Column 1 (Left: Cyan Flow) -->
    <linearGradient id="col1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Column 2 (Center: White / Light Cascade) -->
    <linearGradient id="col2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Column 3 (Right: Royal Blue Flow) -->
    <linearGradient id="col3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mount" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Clean, soft ambient shadow -->
    <filter id="ambientShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#ambientShadow)"/>
  <!-- Crisp highlight inner border -->
  <rect x="33" y="33" width="446" height="446" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Left Column (Cascade Bar 1 - Lower offset) -->
  <g filter="url(#pillShadow)">
    <rect x="100" y="160" width="80" height="200" rx="40" fill="url(#col1)"/>
    <!-- Minimal dot / circle inside -->
    <circle cx="140" cy="204" r="14" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- Center Column (Cascade Bar 2 - Tall / Hero with Mountain & Sun) -->
  <g filter="url(#pillShadow)">
    <!-- Main white card -->
    <rect x="206" y="104" width="100" height="296" rx="50" fill="url(#col2)"/>
    <!-- Clean Minimal Sun -->
    <circle cx="256" cy="168" r="18" fill="#F59E0B"/>
    <!-- Minimalist Geometric Mountain -->
    <path d="M214 340 L 244 285 L 268 322 L 282 304 L 298 340 Z" fill="url(#mount)"/>
  </g>

  <!-- Right Column (Cascade Bar 3 - Medium offset with Play Triangle) -->
  <g filter="url(#pillShadow)">
    <rect x="332" y="136" width="80" height="232" rx="40" fill="url(#col3)"/>
    <!-- Minimalist Play Icon for Video -->
    <polygon points="368,236 384,248 368,260" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>
