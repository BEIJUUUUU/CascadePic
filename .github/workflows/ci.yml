name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

  test:
    name: Test (pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --maxfail=1

  build:
    name: Build (PyInstaller)
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build distributable
        shell: pwsh
        run: ./build.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist/CascadePic/CascadePic.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe to be produced by the build."
            exit 1
          }
          $size = (Get-ChildItem dist/CascadePic -Recurse -File |
            Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Built: {0}" -f $exe)
          Write-Host ("Bundle size: {0:N0} MB" -f $size)
          # CI runners have no VLC/ffmpeg, so warn rather than fail on those.
          if (-not (Test-Path "dist/CascadePic/libvlc.dll")) {
            Write-Warning "libvlc.dll absent (expected on CI; bundled in release builds)."
          }
          if (-not (Test-Path "dist/CascadePic/context_menu")) {
            Write-Error "Context menu scripts were not bundled."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CascadePic-windows-x64
          path: dist/CascadePic/
          retention-days: 7
          if-no-files-found: error
