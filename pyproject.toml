[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "waterfall-media-viewer"
version = "0.1.0"
description = "A Windows waterfall image and video viewer built with Python and PySide6."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow>=11.1,<13",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]
video = [
    "python-vlc>=3.0.21203,<4",
]

[project.scripts]
waterfall-viewer = "waterfall_viewer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/waterfall_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
